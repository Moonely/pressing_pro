spring:
  application:
    name: pressingpro-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:pressingpro}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-please}
    expiration-ms: 86400000
  cors:
    allowed-origins:
      - http://localhost:8080
      - http://localhost:5173
