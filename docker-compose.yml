version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    image: pressingpro/frontend:latest
    container_name: pressingpro-frontend
    environment:
      BACKEND_URL: "http://backend:8080"
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pressingpro-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pressingpro/backend:latest
    container_name: pressingpro-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pressingpro
      SPRING_DATASOURCE_USERNAME: pressingpro
      SPRING_DATASOURCE_PASSWORD: pressingpro
      JWT_SECRET: change-me-in-production
    ports:
      - "9090:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pressingpro-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: pressingpro-db
    environment:
      POSTGRES_DB: pressingpro
      POSTGRES_USER: pressingpro
      POSTGRES_PASSWORD: pressingpro
    volumes:
      - pressingpro-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pressingpro"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pressingpro-net
    restart: unless-stopped

networks:
  pressingpro-net:
    driver: bridge

volumes:
  pressingpro-db-data:
